name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify tests, dependencies and publication artifacts
        run: ./mvnw -B -ntp -Partifacts,dependency-check install
      - name: Verify independent consumer
        run: ./mvnw -B -ntp -N -Pconsumer-tests verify
